<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review | WDD 131</title>
  <meta name="description" content="Product review form page for WDD 131 Dynamic Web Fundamentals course to submit product ratings and review details.">
  <meta name="author" content="Mukasa Precious">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Name -->
      <label for="product-select">Product Name</label>
      <select id="product-select" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset class="rating-fieldset">
        <legend>Overall Rating</legend>
        <div class="rating-group">
          <input type="radio" id="rating1" name="rating" value="1" required>
          <label for="rating1">☆</label>

          <input type="radio" id="rating2" name="rating" value="2" required>
          <label for="rating2">☆☆</label>

          <input type="radio" id="rating3" name="rating" value="3" required>
          <label for="rating3">☆☆☆</label>

          <input type="radio" id="rating4" name="rating" value="4" required>
          <label for="rating4">☆☆☆☆</label>

          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5">☆☆☆☆☆</label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
      <label for="install-date">Date of Installation</label>
      <input type="date" id="install-date" name="installDate" required>

      <!-- Useful Features -->
      <fieldset class="features-fieldset">
        <legend>Which features did you find useful in the product?<br><em>(Check all that apply)</em></legend>
        
        <div class="checkbox-option">
          <input type="checkbox" id="feature-durability" name="features" value="durability">
          <label for="feature-durability">Durability</label>
        </div>

        <div class="checkbox-option">
          <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
          <label for="feature-ease">Ease of Use</label>
        </div>

        <div class="checkbox-option">
          <input type="checkbox" id="feature-performance" name="features" value="performance">
          <label for="feature-performance">Performance</label>
        </div>

        <div class="checkbox-option">
          <input type="checkbox" id="feature-design" name="features" value="design">
          <label for="feature-design">Design</label>
        </div>
      </fieldset>

      <!-- Written Review -->
      <label for="review-text">Written Review <span>(Optional)</span></label>
      <textarea id="review-text" name="reviewText" rows="4"></textarea>

      <!-- User Name -->
      <label for="user-name">Your Name <span>(Optional)</span></label>
      <input type="text" id="user-name" name="userName">

      <!-- Submit Button -->
      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>

  <footer>
    <p>&copy;2024 🌸 Mukasa Precious 🌸 Uganda</p>
    <p>Last Modification: 02/26/2024 13:56:10</p>
  </footer>
</body>
</html>
